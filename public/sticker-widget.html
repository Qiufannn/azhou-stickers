<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;padding:10px;color:var(--color-text-primary,#222);background:transparent}
#items{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.sticker{width:132px;max-width:45%;border:1px solid #8883;border-radius:14px;padding:8px;background:var(--color-background-secondary,#f7f7f7);box-sizing:border-box}
.sticker img{display:block;width:100%;height:120px;object-fit:contain;border-radius:8px}
.name{font-size:13px;font-weight:600;margin-top:6px;overflow-wrap:anywhere}
.labels{font-size:11px;opacity:.7;margin-top:3px}
#status{font-size:13px;opacity:.7}
</style>
</head>
<body>
<div id="status">正在加载表情包……</div><div id="items"></div>
<script>
const statusEl=document.getElementById('status');
const itemsEl=document.getElementById('items');
function render(payload){
  const data=payload?.structuredContent || payload?.result?.structuredContent || payload?.toolOutput || payload;
  const stickers=Array.isArray(data?.stickers)?data.stickers:[];
  if(!stickers.length){statusEl.textContent='没有收到表情包数据；请在聊天中搜索或挑选一张表情包。';return;}
  statusEl.textContent=stickers.length===1?'你的原版表情包':'找到的原版表情包';
  itemsEl.replaceChildren();
  for(const s of stickers){
    if(!s.imageUrl) continue;
    const card=document.createElement('div');card.className='sticker';
    const img=document.createElement('img');img.src=s.imageUrl;img.alt=s.name||'表情包';img.loading='lazy';
    const name=document.createElement('div');name.className='name';name.textContent=s.name||'表情包';
    const labels=document.createElement('div');labels.className='labels';labels.textContent=(s.labels||[]).join(' · ');
    card.append(img,name,labels);itemsEl.append(card);
  }
}
window.addEventListener('message',(event)=>{
 const msg=event.data;
 if(!msg||typeof msg!=='object')return;
 if(msg.method==='ui/notifications/tool-result')render(msg.params?.content?.[0]||msg.params?.structuredContent||msg.params);
 if(msg.method==='ui/notifications/tool-input'){}
 if(msg.type==='tool-result')render(msg.payload||msg.data);
});
if(window.openai?.toolOutput)render(window.openai.toolOutput);
</script>
</body>
</html>
